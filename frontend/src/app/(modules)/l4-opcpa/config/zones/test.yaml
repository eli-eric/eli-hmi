# One laser per block. Everything about a signal — its PV, what the row is
# called, how it is rounded — is written in that signal's own `pvs:` entry.
# Units and rounding that follow from the signal itself (°C, ns, mV, whole
# millivolts of bias) are the component's, so most lasers say neither.
lasers:
  - id: NL2
    pvs:
      connection: L4-OPCPA-NL2:PortControl.CNCT
      fullPower: L4-OPCPA-NL2:FullPower
      shutter: L4-OPCPA-NL2:IO:15:RC1_pin31
      phdMean: L4-OPCPA-NL2:PHD1K000:49:Mean
      regenState: L4-OPCPA-NL2:SY3PL50M:32:State
      regenTemp: L4-OPCPA-NL2:TK6:44:DisplayTemperature
      phd2Mean: L4-OPCPA-NL2:PHD1K000:48:Mean
      attenuator: L4-OPCPA-NL2:SM5-ATT1:51:CurrentPosition
      loadedWaveform: SI_NL2_LOADED_WAVEFORM
      latestWaveform: SI_NL2_LATEST_WAVEFORM
      modboxMbc1: L4-OPCPA-NL2::ModBox:MBC1:BiasValue
      modboxMbc2: L4-OPCPA-NL2::ModBox:MBC2:BiasValue
    sequences:
      # The state PV says whether the control system is running this sequence,
      # and `command` names the button that starts it. These are the names the
      # mock backend pulses when a command PV is fired (`BI_<laser>_SEQ_<ID>`
      # in l4_opcpa.go), so a press still animates the row in dev; a real zone
      # names whatever records controls publishes.
      - {
          label: 'Start Laser',
          pv: BI_NL2_SEQ_START_LASER,
          command: START_LASER,
        }
      - { label: 'Stop Laser', pv: BI_NL2_SEQ_STOP_LASER, command: STOP_LASER }
      - {
          label: 'Set to Alignment Mode',
          pv: BI_NL2_SEQ_ALIGNMENT_MODE,
          command: ALIGNMENT_MODE,
        }
      - {
          label: 'Set to System Standby',
          pv: BI_NL2_SEQ_SYSTEM_STANDBY,
          command: SYSTEM_STANDBY,
        }
      - {
          label: 'Set All Flashlamps to Run',
          pv: BI_NL2_SEQ_FLASHLAMPS_RUN,
          command: FLASHLAMPS_RUN,
        }
      - {
          label: 'Set All Flashlamps to Standby',
          pv: BI_NL2_SEQ_FLASHLAMPS_STANDBY,
          command: FLASHLAMPS_STANDBY,
        }
    triggerDelay:
      [
        L4-OPCPA-NL2:PS5059:22:Ch1TriggeringDelay,
        L4-OPCPA-NL2:PS5059:22:Ch2TriggeringDelay,
      ]
    mss:
      - { label: 'PSS permission', pv: L4-PSS:NP2_PERMISSION_TO_OPERATE_CH1 }
      - { label: 'MSS permission', pv: L4-MSS:NP2_PERMISSION_TO_OPERATE_CH1 }
      - { label: 'OPCPA MSS interlock', pv: L4-MSS:OPA_interlock }
      - { label: 'NL2 vacuum good', pv: L4-VCS-NL2:ReadyToFire }
      - {
          label: 'OPCPA pump tel. vac. good',
          pv: L4-VCS-NSOPA_PUMP_TEL:ReadyToFire,
        }
      - {
          label: 'OPCPA seed tel. vac. good',
          pv: L4-VCS-NSOPA_SEED_TEL:ReadyToFire,
        }
      - { label: 'Beamdump chiller alarm', pv: L4-MSS:BEAMDUMP_CHILLER_ALARM }
      - {
          label: 'Beamdump chiller warning',
          pv: L4-MSS:BEAMDUMP_CHILLER_WARNING,
        }
    moduleErrors:
      - { label: PS1225:11, pv: L4-OPCPA-NL2:PS1225:11:ErrorCode }
      - { label: PS1225:12, pv: L4-OPCPA-NL2:PS1225:12:ErrorCode }
      - { label: PS1225:13, pv: L4-OPCPA-NL2:PS1225:13:ErrorCode }
      - { label: PS1225:14, pv: L4-OPCPA-NL2:PS1225:14:ErrorCode }
      - { label: IO:15, pv: L4-OPCPA-NL2:IO:15:ErrorCode }
      - { label: LDM150V5:16, pv: L4-OPCPA-NL2:LDM150V5:16:ErrorCode }
      - { label: PS5059:22, pv: L4-OPCPA-NL2:PS5059:22:ErrorCode }
      - { label: PS5059:23, pv: L4-OPCPA-NL2:PS5059:23:ErrorCode }
      - { label: PS5059:24, pv: L4-OPCPA-NL2:PS5059:24:ErrorCode }
      - { label: PS5059:25, pv: L4-OPCPA-NL2:PS5059:25:ErrorCode }
      - { label: PS5059:26, pv: L4-OPCPA-NL2:PS5059:26:ErrorCode }
      - { label: PS5059:27, pv: L4-OPCPA-NL2:PS5059:27:ErrorCode }
      - { label: PS5059:28, pv: L4-OPCPA-NL2:PS5059:28:ErrorCode }
      - { label: SY3PL50M:32, pv: L4-OPCPA-NL2:SY3PL50M:32:ErrorCode }
      - { label: HV40W:40, pv: L4-OPCPA-NL2:HV40W:40:ErrorCode }
      - { label: HV40W:42, pv: L4-OPCPA-NL2:HV40W:42:ErrorCode }
      - { label: TK6:44, pv: L4-OPCPA-NL2:TK6:44:ErrorCode }
      - { label: PHD1K000:48, pv: L4-OPCPA-NL2:PHD1K000:48:ErrorCode }
      - { label: PHD1K000:49, pv: L4-OPCPA-NL2:PHD1K000:49:ErrorCode }
      - { label: SM5-SH:50, pv: L4-OPCPA-NL2:SM5-SH:50:ErrorCode }
      - { label: SM5-ATT1:51, pv: L4-OPCPA-NL2:SM5-ATT1:51:ErrorCode }
      - { label: SM5-ATT2:52, pv: L4-OPCPA-NL2:SM5-ATT2:52:ErrorCode }
    chillers:
      - {
          label: 'PS1225:11',
          flow: L4-OPCPA-NL2:PS1225:11:MeasuredFlow,
          temp: L4-OPCPA-NL2:PS1225:11:T_out,
          level: L4-OPCPA-NL2:PS1225:11:MeasuredLevel,
        }
      - {
          label: 'PS1225:12',
          flow: L4-OPCPA-NL2:PS1225:12:MeasuredFlow,
          temp: L4-OPCPA-NL2:PS1225:12:T_out,
          level: L4-OPCPA-NL2:PS1225:12:MeasuredLevel,
        }
      - {
          label: 'PS1225:13',
          flow: L4-OPCPA-NL2:PS1225:13:MeasuredFlow,
          temp: L4-OPCPA-NL2:PS1225:13:T_out,
          level: L4-OPCPA-NL2:PS1225:13:MeasuredLevel,
        }
      - {
          label: 'PS1225:14',
          flow: L4-OPCPA-NL2:PS1225:14:MeasuredFlow,
          temp: L4-OPCPA-NL2:PS1225:14:T_out,
          level: L4-OPCPA-NL2:PS1225:14:MeasuredLevel,
        }
    flashlamps:
      - { label: 'PS5059:22 Ch1', pv: L4-OPCPA-NL2:PS5059:22:Ch1_State }
      - { label: 'PS5059:22 Ch2', pv: L4-OPCPA-NL2:PS5059:22:Ch2_State }
      - { label: 'PS5059:23 Ch1', pv: L4-OPCPA-NL2:PS5059:23:Ch1_State }
      - { label: 'PS5059:23 Ch2', pv: L4-OPCPA-NL2:PS5059:23:Ch2_State }
      - { label: 'PS5059:24 Ch1', pv: L4-OPCPA-NL2:PS5059:24:Ch1_State }
      - { label: 'PS5059:24 Ch2', pv: L4-OPCPA-NL2:PS5059:24:Ch2_State }
      - { label: 'PS5059:25 Ch1', pv: L4-OPCPA-NL2:PS5059:25:Ch1_State }
      - { label: 'PS5059:25 Ch2', pv: L4-OPCPA-NL2:PS5059:25:Ch2_State }
      - { label: 'PS5059:26 Ch1', pv: L4-OPCPA-NL2:PS5059:26:Ch1_State }
      - { label: 'PS5059:26 Ch2', pv: L4-OPCPA-NL2:PS5059:26:Ch2_State }
      - { label: 'PS5059:27 Ch1', pv: L4-OPCPA-NL2:PS5059:27:Ch1_State }
      - { label: 'PS5059:27 Ch2', pv: L4-OPCPA-NL2:PS5059:27:Ch2_State }
      - { label: 'PS5059:28 Ch1', pv: L4-OPCPA-NL2:PS5059:28:Ch1_State }
      - { label: 'PS5059:28 Ch2', pv: L4-OPCPA-NL2:PS5059:28:Ch2_State }
    modbox:
      - { label: 'AWG state', pv: L4-OPCPA-NL2:ModBox:AWG:State }
      - { label: 'RF1 power', pv: L4-OPCPA-NL2:ModBox:RF1:Power }
      - { label: 'RF2 power', pv: L4-OPCPA-NL2:ModBox:RF2:Power }
      - { label: 'AOM state', pv: L4-OPCPA-NL2:ModBox:AOM:State }
      - { label: 'LAS1 state', pv: L4-OPCPA-NL2:ModBox:LAS1:State }
      - { label: 'YDFA state', pv: L4-OPCPA-NL2:ModBox:YDFA:State }
      - { label: 'AWG software key', pv: L4-OPCPA-NL2:ModBox:YDFA:SoftwareKey }
    delayPresets: [50, 500, 700, 790]
    commands:
      START_LASER: START_LASER
      STOP_LASER: STOP_LASER
      ALIGNMENT_MODE: L4-OPCPA-NL2:SetAlignmentMode
      SYSTEM_STANDBY: SYSTEM_STANDBY
      FLASHLAMPS_RUN: FLASHLAMPS_RUN
      FLASHLAMPS_STANDBY: FLASHLAMPS_STANDBY
      MODBOX_ON: MODBOX_ON
      MODBOX_OFF: { pv: L4-OPCPA-NL2:ModBox:Awake, value: Sleep }
      # A device reports from one record and is moved by another: these are
      # the write side of the shutter and attenuator rows.
      OPEN_SHUTTER: { pv: L4-OPCPA-NL2:SM5-SH:50:SetPosition, value: 1 }
      CLOSE_SHUTTER: { pv: L4-OPCPA-NL2:SM5-SH:50:SetPosition, value: 0 }
      SET_ATTENUATOR: L4-OPCPA-NL2:SM5-ATT1:51:SetPosition
      SET_DELAY: L4-OPCPA-NL2:PS5059:22:SetBothChannelsTrigDelay
      LOAD_WAVEFORM: LOAD_WAVEFORM

  # A laser that is not NL2: no Modbox at all, a different set of modules, and
  # its own device ids on the rows. Here to be looked at beside NL2 while the
  # screen is taken to real lasers — the panel must not assume the reference
  # laser's hardware.
  - id: NL4
    pvs:
      connection: L4-OPCPA-NL4:PortControl.CNCT
      fullPower: L4-OPCPA-NL4:FullPower
      shutter: L4-OPCPA-NL4:IO:08:RC1_pin31
      # Each row's name sits with the PV it names. Left unset they would
      # print the reference laser's hardware, which looks deliberate and is
      # wrong.
      phdMean: { pv: L4-OPCPA-NL4:PHD1K000:12:Mean, label: 'PHD1K000:12/Mean' }
      regenState:
        { pv: L4-OPCPA-NL4:SY9PL20M:07:State, label: 'Regen SY9PL20M:07' }
      regenTemp:
        {
          pv: L4-OPCPA-NL4:TK3:21:DisplayTemperature,
          label: 'Regen Temp TK3:21',
        }
      phd2Mean: { pv: L4-OPCPA-NL4:PHD1K000:13:Mean, label: 'PHD1K000:13/Mean' }
      attenuator:
        {
          pv: L4-OPCPA-NL4:SM1-ATT3:22:CurrentPosition,
          label: 'Atten. SM1:ATT3:22',
        }
      # No waveform or bias PVs: this laser has no Modbox, so the whole section
      # is absent rather than present and empty.
    sequences:
      - {
          label: 'Start Laser',
          pv: BI_NL4_SEQ_START_LASER,
          command: START_LASER,
        }
      - { label: 'Stop Laser', pv: BI_NL4_SEQ_STOP_LASER, command: STOP_LASER }
      - {
          label: 'Set All Flashlamps to Run',
          pv: BI_NL4_SEQ_FLASHLAMPS_RUN,
          command: FLASHLAMPS_RUN,
        }
      - {
          label: 'Set All Flashlamps to Standby',
          pv: BI_NL4_SEQ_FLASHLAMPS_STANDBY,
          command: FLASHLAMPS_STANDBY,
        }
    triggerDelay:
      [
        L4-OPCPA-NL4:PS5059:41:Ch1TriggeringDelay,
        L4-OPCPA-NL4:PS5059:41:Ch2TriggeringDelay,
      ]
    mss:
      - { label: 'PSS permission', pv: L4-PSS:NP4_PERMISSION_TO_OPERATE_CH1 }
      - { label: 'MSS permission', pv: L4-MSS:NP4_PERMISSION_TO_OPERATE_CH1 }
      - { label: 'NL4 vacuum good', pv: L4-VCS-NL4:ReadyToFire }
    moduleErrors:
      - { label: 'PS1225:31', pv: L4-OPCPA-NL4:PS1225:31:ErrorCode }
      - { label: 'IO:08', pv: L4-OPCPA-NL4:IO:08:ErrorCode }
      - { label: 'SY9PL20M:07', pv: L4-OPCPA-NL4:SY9PL20M:07:ErrorCode }
      - { label: 'PHD1K000:12', pv: L4-OPCPA-NL4:PHD1K000:12:ErrorCode }
    chillers:
      - {
          label: 'PS1225:31',
          flow: L4-OPCPA-NL4:PS1225:31:MeasuredFlow,
          temp: L4-OPCPA-NL4:PS1225:31:T_out,
          level: L4-OPCPA-NL4:PS1225:31:MeasuredLevel,
        }
      - {
          label: 'PS1225:32',
          flow: L4-OPCPA-NL4:PS1225:32:MeasuredFlow,
          temp: L4-OPCPA-NL4:PS1225:32:T_out,
          level: L4-OPCPA-NL4:PS1225:32:MeasuredLevel,
        }
    flashlamps:
      - { label: 'PS5059:41 Ch1', pv: L4-OPCPA-NL4:PS5059:41:Ch1_State }
      - { label: 'PS5059:41 Ch2', pv: L4-OPCPA-NL4:PS5059:41:Ch2_State }
      - { label: 'PS5059:42 Ch1', pv: L4-OPCPA-NL4:PS5059:42:Ch1_State }
      - { label: 'PS5059:42 Ch2', pv: L4-OPCPA-NL4:PS5059:42:Ch2_State }
    delayPresets: [50, 500, 790]
    commands:
      # No MODBOX_ON / MODBOX_OFF / LOAD_WAVEFORM / SEND_YDFA_CURRENT: there is
      # no Modbox to send them to, and a missing key hides the button.
      START_LASER: START_LASER
      STOP_LASER: STOP_LASER
      ALIGNMENT_MODE: L4-OPCPA-NL4:SetAlignmentMode
      SYSTEM_STANDBY: SYSTEM_STANDBY
      FLASHLAMPS_RUN: FLASHLAMPS_RUN
      FLASHLAMPS_STANDBY: FLASHLAMPS_STANDBY
      OPEN_SHUTTER: { pv: L4-OPCPA-NL4:SM1-SH:08:SetPosition, value: 1 }
      CLOSE_SHUTTER: { pv: L4-OPCPA-NL4:SM1-SH:08:SetPosition, value: 0 }
      SET_ATTENUATOR: L4-OPCPA-NL4:SM1-ATT3:22:SetPosition
      SET_DELAY: L4-OPCPA-NL4:PS5059:41:SetBothChannelsTrigDelay
