# yaml-language-server: $schema=./lasers.schema.json
#
# L4 OPCPA per-laser config — the FRONTEND source of truth.
# Every value is the FULL PV name for that signal, exactly as the controls team
# / EPICS gateway provides it. The frontend reads these verbatim; it does NOT
# assemble names from prefixes. See README.md for field docs.
#
# The names below are currently the mock-backend convention (BI_/AI_/SI_).
# When controls deliver the real EPICS names (e.g. SY3PL50M:32), just replace
# the strings here — no code change. Open in an editor with the YAML extension
# for autocomplete + inline validation (from lasers.schema.json above).
#
# NB: the mock backend (backend/mockup-websocket-server/l4_opcpa.go) is
# TEST-ONLY and does not read this file; it has its own constants.

lasers:
  - id: NL1
    pvs:
      connection: BI_NL1_CONN
      fullPower: BI_NL1_FULLP
      shutter: BI_NL1_SHUTTER
      phdMean: AI_NL1_PHD_MEAN
      regenState: BI_NL1_REGEN_STATE
      regenTemp: AI_TEMP_NL1_REGEN
      phd2Mean: AI_NL1_PHD2_MEAN
      attenuator: AI_NL1_ATT
      loadedWaveform: SI_NL1_LOADED_WAVEFORM
    triggerDelay: [AI_NL1_TRIG_DELAY_CH1, AI_NL1_TRIG_DELAY_CH2]
    mss: [BI_NL1_MSS_1, BI_NL1_MSS_2, BI_NL1_MSS_3, BI_NL1_MSS_4, BI_NL1_MSS_5, BI_NL1_MSS_6]
    moduleErrors:
      - { label: REGEN, pv: BI_NL1_ERR_REGEN }
      - { label: CHILLER_11, pv: BI_NL1_ERR_CHILLER_11 }
      - { label: CHILLER_12, pv: BI_NL1_ERR_CHILLER_12 }
      - { label: CHILLER_13, pv: BI_NL1_ERR_CHILLER_13 }
      - { label: CHILLER_14, pv: BI_NL1_ERR_CHILLER_14 }
      - { label: FLASHLAMPS, pv: BI_NL1_ERR_FLASHLAMPS }
    chillers:
      - { label: 'PS1225:11', flow: AI_NL1_CHILLER_11_FLOW, temp: AI_NL1_CHILLER_11_TEMP, level: AI_NL1_CHILLER_11_LEVEL }
      - { label: 'PS1225:12', flow: AI_NL1_CHILLER_12_FLOW, temp: AI_NL1_CHILLER_12_TEMP, level: AI_NL1_CHILLER_12_LEVEL }
