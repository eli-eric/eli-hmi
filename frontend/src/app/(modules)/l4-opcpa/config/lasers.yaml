    flashlamps:
      - { label: '22 Ch1', pv: SI_NL1_FL_22_CH1 }
      - { label: '22 Ch2', pv: SI_NL1_FL_22_CH2 }
      - { label: '23 Ch1', pv: SI_NL1_FL_23_CH1 }
