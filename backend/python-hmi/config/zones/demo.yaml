# Demo zone — three lasers, generated from the `test` zone by substituting the
# laser id into every PV name. NL1/NL3 mirror NL2's topology, which is exactly
# what `l4-opcpa/README.md` says to do until Confluence documents where they
# actually diverge (chiller bank counts, flashlamp box ids per laser).
#
# Its only job is to show the grid wrapping with more than one panel:
# `ZONE_CODE=demo python -m app`. The `test` zone stays the faithful copy of
# what the React app ships.
# Engineering units for the numeric readouts, applied to every laser below.
# A laser may override any of these with its own `units:` block. The config
# value wins over the PV's own EGU metadata and over the component default.
units:
  regenTemp: '°C'
  triggerDelay: ns
  chillerFlow: l/min
  chillerTemp: '°C'
  chillerLevel: '%'

# How each numeric readout is rounded, keyed by the same signal roles as
# `units:` above. A plain number is decimal places; the object form
# ({format: exponential, toExponential: 2}, {format: precision, toPrecision: 4})
# is there when decimals are the wrong question. A laser may override any of
# these with its own `format:` block.
#
# Roles left out fall back to three decimal places, which is what every readout
# did before this block existed — so only the two that differed are listed.
format:
  modboxMbc1: 2
  modboxMbc2: 2

lasers:
  - id: NL1
    pvs:
      connection: L4-OPCPA-NL1:PortControl.CNCT
      fullPower: L4-OPCPA-NL1:FullPower
      shutter: L4-OPCPA-NL1:IO:15:RC1_pin31
      phdMean: L4-OPCPA-NL1:PHD1K000:49:Mean
      regenState: L4-OPCPA-NL1:SY3PL50M:32:State
      regenTemp: L4-OPCPA-NL1:TK6:44:DisplayTemperature
      phd2Mean: L4-OPCPA-NL1:PHD1K000:48:Mean
      attenuator: L4-OPCPA-NL1:SM5-ATT1:51:CurrentPosition
      loadedWaveform: SI_NL1_LOADED_WAVEFORM
      latestWaveform: SI_NL1_LATEST_WAVEFORM
      modboxMbc1: L4-OPCPA-NL1::ModBox:MBC1:BiasValue
      modboxMbc2: L4-OPCPA-NL1::ModBox:MBC2:BiasValue
      sequencerRunning: L4-OPCPA-NL1:SetAlignmentMode.BUSY
    triggerDelay:
      [
        L4-OPCPA-NL1:PS5059:22:Ch1TriggeringDelay,
        L4-OPCPA-NL1:PS5059:22:Ch2TriggeringDelay,
      ]
    mss:
      - { label: "PSS permission", pv: L4-PSS:NP2_PERMISSION_TO_OPERATE_CH1 }
      - { label: "MSS permission", pv: L4-MSS:NP2_PERMISSION_TO_OPERATE_CH1 }
      - { label: "OPCPA MSS interlock", pv: L4-MSS:OPA_interlock }
      - { label: "NL1 vacuum good", pv: L4-VCS-NL1:ReadyToFire }
      - {
          label: "OPCPA pump tel. vac. good",
          pv: L4-VCS-NSOPA_PUMP_TEL:ReadyToFire,
        }
      - {
          label: "OPCPA seed tel. vac. good",
          pv: L4-VCS-NSOPA_SEED_TEL:ReadyToFire,
        }
      - { label: "Beamdump chiller alarm", pv: L4-MSS:BEAMDUMP_CHILLER_ALARM }
      - {
          label: "Beamdump chiller warning",
          pv: L4-MSS:BEAMDUMP_CHILLER_WARNING,
        }
    moduleErrors:
      - { label: PS1225:11, pv: L4-OPCPA-NL1:PS1225:11:ErrorCode }
      - { label: PS1225:12, pv: L4-OPCPA-NL1:PS1225:12:ErrorCode }
