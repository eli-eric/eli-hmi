# The mirror motors. Only `components:` belongs in an extra file — screen-wide
# settings live in gui.yaml.
#
# These use `prefix:`, the EPICS motor record convention, where every signal is
# a *field* of one record (.RBV, .VAL, .DMOV, .STOP, .HLS, .LLS). That is what a
# real motor looks like. It cannot be served by the local base-only IOC, because
# a record name may not contain a dot — see `components/motor/__init__.py`.
components:
  - component: panel
    title: Mirror M1
    components:
      - component: motor
        label: Pitch
        prefix: L4-MOT-M1:PITCH
        units: mrad
        format: 4
        range: [-5, 5]
        presets: [-1, 0, 1]
        step: 0.01
      - component: motor
        label: Roll
        prefix: L4-MOT-M1:ROLL
        units: mrad
        format: 4
        range: [-5, 5]
        presets: [0]
        step: 0.01
      - component: motor
        label: Z
        prefix: L4-MOT-M1:Z
        units: mm
        format: 3
        range: [0, 100]
        presets: [0, 50, 100]
