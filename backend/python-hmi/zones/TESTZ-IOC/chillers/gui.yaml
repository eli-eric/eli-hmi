#
#   L4-OPCPA-NL2:PortControl.CNCT  ->  L4-OPCPA-NL2:PortControl:CNCT
#   L4-OPCPA-NL2:SetAlignmentMode.BUSY  ->  L4-OPCPA-NL2:SetAlignmentMode:BUSY
#
# Everything else is identical, so what the panel renders here is what it
# renders against `TESTZ` in the hall.
#
# Chiller plant — a screen with no Python behind it at all.
#
# Everything here is a component from `components/`, configured. Copy this file
# into another zone's folder, change the PV names, and that zone has the screen.
#
#   grid   a table: devices down the side, quantities across the top
#   group  several related signals as one pill that expands into a list
#   value  one row: label, reading, and optionally buttons or a setpoint
#
# `range:` is engineering information, not decoration: it is what the simulator
# drifts inside and what the local IOC puts on the record as LOPR/HOPR. `alarm:`
# becomes the record's real limit fields, so a MINOR or MAJOR on this screen is
# a genuine EPICS alarm that crossed a genuine limit.
title: Chillers
order: 20
description: Cooling plant for the L4 OPCPA lasers.

components:
  - component: panel
    title: Chiller bank
    width: double
    components:
