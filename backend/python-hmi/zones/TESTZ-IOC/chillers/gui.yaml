        columns:
          - { key: flow,  label: Flow,  units: l/min, format: 2, range: [11.5, 15.5], alarm: { low: 11.0, lolo: 10.0 } }
          - { key: temp,  label: Temp,  units: degC,  format: 2, range: [22.0, 24.5], alarm: { high: 25.5, hihi: 26.5 } }
          - { key: level, label: Water, units: "%",   format: 1, range: [80, 98],     alarm: { low: 75, lolo: 70 } }
          - { key: hours, label: Hours, format: 0, range: [0, 40000], integer: true }
        rows:
          - label: "PS1225:11"
            flow:  L4-CHW-PS1225:11:MeasuredFlow
            temp:  L4-CHW-PS1225:11:T_out
            level: L4-CHW-PS1225:11:MeasuredLevel
            hours: L4-CHW-PS1225:11:RunHours
          - label: "PS1225:12"
            flow:  L4-CHW-PS1225:12:MeasuredFlow
            # This one runs hot enough to cross its own HIHI, so the screen
            # shows what a MAJOR alarm looks like from the first page load.
            temp:  L4-CHW-PS1225:12:T_out
            level: L4-CHW-PS1225:12:MeasuredLevel
            hours: L4-CHW-PS1225:12:RunHours
            demo:  { temp: { value: 26.8 } }
          - label: "PS1225:13"
            flow:  L4-CHW-PS1225:13:MeasuredFlow
            temp:  L4-CHW-PS1225:13:T_out
            # Never initialised, so it reads INVALID/UDF — the state an operator
            # most needs to recognise, and the one that never happens on demand.
            level: L4-CHW-PS1225:13:MeasuredLevel
            demo:  { level: { undefined: true } }
          - label: "PS1225:14"
            flow:  L4-CHW-PS1225:14:MeasuredFlow
            temp:  L4-CHW-PS1225:14:T_out
            level: L4-CHW-PS1225:14:MeasuredLevel
            hours: L4-CHW-PS1225:14:RunHours

  - component: panel
    title: Plant
    components:
      - component: group
        label: Pumps
        mode: states
        items:
          - { label: "Pump 1", pv: "L4-CHW:PUMP1:Running" }
          - { label: "Pump 2", pv: "L4-CHW:PUMP2:Running" }
          - { label: "Pump 3", pv: "L4-CHW:PUMP3:Running", demo: { value: 0 } }
      - component: group
        label: Faults
        mode: codes
        note: Code 0000 means no fault.
        items:
          - { label: "PS1225:11", pv: "L4-CHW-PS1225:11:ErrorCode" }
          - { label: "PS1225:12", pv: "L4-CHW-PS1225:12:ErrorCode", demo: { value: "0021" } }
          - { label: "PS1225:13", pv: "L4-CHW-PS1225:13:ErrorCode" }
          - { label: "PS1225:14", pv: "L4-CHW-PS1225:14:ErrorCode" }
