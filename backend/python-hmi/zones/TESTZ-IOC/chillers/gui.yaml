        label: Supply pressure
        pv: L4-CHW:SupplyPressure
        units: bar
        format: 2
        range: [3.0, 5.0]
        alarm: { low: 3.2, lolo: 3.0 }
      - component: value
        label: Setpoint
        pv: L4-CHW:TempSetpoint
        units: degC
        format: 1
        range: [18, 26]
        setpoint: { label: Set supply temperature, presets: [20, 21, 22, 23] }
      - component: value
        label: Plant mode
        pv: L4-CHW:Mode
        kind: enum
        states: ["OFF", COOLING, STANDBY, FAULT]
        demo: { value: 1 }
