# L4 OPCPA per-laser config — the FRONTEND source of truth.
# Every value is the FULL PV name for that signal, exactly as the controls team
# / EPICS gateway provides it. The frontend reads these verbatim; it does NOT
# assemble names from prefixes. See README.md for field docs.
#
# The names below are currently the mock-backend convention (BI_/AI_/SI_).
# When controls deliver the real EPICS names (e.g. SY3PL50M:32), just replace
# the strings here — no code change. Validate the whole directory before
# deploying — see ../../README.md for the config-validator command.
#
# NB: the mock backend (backend/mockup-websocket-server/l4_opcpa.go) is
# TEST-ONLY and does not read this file; it has its own constants.

lasers:
  - id: NL2
    pvs:
      connection: BI_NL2_CONN
      fullPower: BI_NL2_FULLP
      shutter: BI_NL2_SHUTTER
      phdMean: AI_NL2_PHD_MEAN
      regenState: BI_NL2_REGEN_STATE
      regenTemp: AI_TEMP_NL2_REGEN
      phd2Mean: AI_NL2_PHD2_MEAN
      attenuator: AI_NL2_ATT
      loadedWaveform: SI_NL2_LOADED_WAVEFORM
      latestWaveform: SI_NL2_LATEST_WAVEFORM
      modboxMbc1: AI_NL2_MBC1
      modboxMbc2: AI_NL2_MBC2
      sequencerRunning: BI_NL2_SEQUENCER_RUNNING
    triggerDelay: [AI_NL2_TRIG_DELAY_CH1, AI_NL2_TRIG_DELAY_CH2]
    mss:
      - { label: 'MSS 1', pv: BI_NL2_MSS_1 }
      - { label: 'MSS 2', pv: BI_NL2_MSS_2 }
      - { label: 'MSS 3', pv: BI_NL2_MSS_3 }
      - { label: 'MSS 4', pv: BI_NL2_MSS_4 }
      - { label: 'MSS 5', pv: BI_NL2_MSS_5 }
      - { label: 'MSS 6', pv: BI_NL2_MSS_6 }
    moduleErrors:
      - { label: REGEN, pv: BI_NL2_ERR_REGEN }
      - { label: CHILLER_11, pv: BI_NL2_ERR_CHILLER_11 }
      - { label: CHILLER_12, pv: BI_NL2_ERR_CHILLER_12 }
      - { label: CHILLER_13, pv: BI_NL2_ERR_CHILLER_13 }
      - { label: CHILLER_14, pv: BI_NL2_ERR_CHILLER_14 }
      - { label: FLASHLAMPS, pv: BI_NL2_ERR_FLASHLAMPS }
    chillers:
      - {
          label: 'PS1225:11',
          flow: AI_NL2_CHILLER_11_FLOW,
          temp: AI_NL2_CHILLER_11_TEMP,
          level: AI_NL2_CHILLER_11_LEVEL,
        }
      - {
          label: 'PS1225:12',
          flow: AI_NL2_CHILLER_12_FLOW,
          temp: AI_NL2_CHILLER_12_TEMP,
          level: AI_NL2_CHILLER_12_LEVEL,
        }
      - {
          label: 'PS1225:13',
          flow: AI_NL2_CHILLER_13_FLOW,
          temp: AI_NL2_CHILLER_13_TEMP,
          level: AI_NL2_CHILLER_13_LEVEL,
        }
      - {
          label: 'PS1225:14',
          flow: AI_NL2_CHILLER_14_FLOW,
          temp: AI_NL2_CHILLER_14_TEMP,
          level: AI_NL2_CHILLER_14_LEVEL,
        }
    flashlamps:
      - { label: '22 Ch1', pv: SI_NL2_FL_22_CH1 }
      - { label: '22 Ch2', pv: SI_NL2_FL_22_CH2 }
      - { label: '23 Ch1', pv: SI_NL2_FL_23_CH1 }
      - { label: '23 Ch2', pv: SI_NL2_FL_23_CH2 }
      - { label: '24 Ch1', pv: SI_NL2_FL_24_CH1 }
      - { label: '24 Ch2', pv: SI_NL2_FL_24_CH2 }
      - { label: '25 Ch1', pv: SI_NL2_FL_25_CH1 }
      - { label: '25 Ch2', pv: SI_NL2_FL_25_CH2 }
      - { label: '26 Ch1', pv: SI_NL2_FL_26_CH1 }
      - { label: '26 Ch2', pv: SI_NL2_FL_26_CH2 }
      - { label: '27 Ch1', pv: SI_NL2_FL_27_CH1 }
      - { label: '27 Ch2', pv: SI_NL2_FL_27_CH2 }
      - { label: '28 Ch1', pv: SI_NL2_FL_28_CH1 }
      - { label: '28 Ch2', pv: SI_NL2_FL_28_CH2 }
    modbox:
      [
        BI_NL2_MODBOX_1,
        BI_NL2_MODBOX_2,
        BI_NL2_MODBOX_3,
        BI_NL2_MODBOX_4,
        BI_NL2_MODBOX_5,
      ]
    delayPresets: [50, 500, 700, 790]
    commands:
      [
        START_LASER,
        STOP_LASER,
        ALIGNMENT_MODE,
        SYSTEM_STANDBY,
        FLASHLAMPS_RUN,
        FLASHLAMPS_STANDBY,
        MODBOX_ON,
        MODBOX_OFF,
        SET_DELAY,
        LOAD_WAVEFORM,
      ]
