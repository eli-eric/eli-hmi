# Example CI job for the standalone config repo: validate every zone against
# the app's real zod schemas on each push. Copy into the config repo and adapt
# (shown for GitLab CI; the steps translate 1:1 to GitHub Actions).
#
# The image is published by the app repo's `docker-build-job-config-validator`
# job and carries the app's real validation — the same code the container runs
# at startup, including the checks a JSON Schema cannot express (duplicate PV
# names, nav ⊆ allowedRoutes, module-ref resolution).
#
# VALIDATOR_TAG pins the app version this config targets — bump it together
# with schemaVersion changes (config and app image deploy together). Set it as
# a CI variable to the branch/tag slug published by the app pipeline
# (e.g. `main`, `dev`, or `v1-2-3`; GitLab transforms `v1.2.3` → `v1-2-3` in
# CI_COMMIT_REF_SLUG). Note: commit SHAs are not published as image tags.
# There is deliberately no default: a moving `latest` would let CI pass against
# a build that is not the one running in production. Leaving it unset fails the
# job at image pull with an invalid-reference error, which is intended.

validate-config:
  image: lcs-harbor.lcs.local/lcs/eli-hmi-config-validator:$VALIDATOR_TAG
  script:
    # GitLab overrides the image ENTRYPOINT and runs from the cloned project
    # directory, so switch to /app first — tsx resolves node_modules and
    # tsconfig.json relative to the working directory.
    - cd /app
    - node_modules/.bin/tsx scripts/validate-config.ts --dir "$CI_PROJECT_DIR" --all

# Locally, where the ENTRYPOINT applies, the same check is one command:
#
#   docker run --rm -v "$PWD:/config:ro" \
#     lcs-harbor.lcs.local/lcs/eli-hmi-config-validator:<app-release-tag> --all
