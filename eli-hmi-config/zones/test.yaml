# Zone config for the local-dev / test-zone deployment (ZONE_CODE=test).
# One file per zone; the zone code IS the filename stem. See ../README.md.

schemaVersion: 1

# Items shown in the top navigation, in order. Every href must also be listed
# in allowedRoutes below.
navigationItems:
  - text: L4 OPCPA Controls
    href: /l4-opcpa

# Routes reachable in this zone; the FIRST entry is the home route (login
# redirect + logo link). Anything not listed redirects to /no-access.
allowedRoutes:
  - /l4-opcpa

# Runtime data files, relative to this config directory's root. A reference
# does not enable a route; allowedRoutes/navigationItems remain the station's
# access-control source. Keeping all template modules referenced makes CI and
# startup validate their data before a zone exposes the corresponding page.
modules:
  l4-opcpa:
    config: modules/l4-opcpa/lasers.yaml
  p3:
    config: modules/p3/config.yaml
  l3bt:
    config: modules/l3bt/config.yaml
  l4fbt:
    config: modules/l4fbt/config.yaml
