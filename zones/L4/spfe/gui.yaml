# Short-pulse frontend: control of APL laser

title: SPFE
description: Control of APL laser
components:
  - component: laser-panel
    id: APL
    macros: {P: L4-SPFE-APL}
    pvs:
      connection: $(P):PortControl.CNCT
      fullPower: $(P):FullPower
      phdMean:
        pv: $(P):PHD1K000:48:Mean
        label: PHD1K000:48/Mean
      regenState: $(P):SY3PL50M:32:State
      regenTemp: $(P):TK6:44:DisplayTemperature
      attenuator:
        pv: $(P):SM5-ATT2:52:CurrentPosition
        label: Atten. SM5-ATT52:52
    sequences:
    - label: Start Laser
      pv: $(P):Start.BUSY
    trigger_delay:
      - $(P):PS5059:22:Ch1TriggeringDelay
    mss:
    - label: PSS permission
      pv: L4-PSS:APL_PERMISSION_TO_OPERATE_CH1
    - label: MSS permission
      pv: L4-MSS:APL_PERMISSION_TO_OPERATE_CH1
    - label: SPFE MSS interlock
      pv: L4-MSS:SPFE_interlock
    - label: SPFE vacuum good
      pv: L4-MSS:SPFE_VACUUM_READY_TO_FIRE
    - label: Beamdump chiller alarm
      pv: L4-MSS:BEAMDUMP_CHILLER_ALARM
    - label: Beamdump chiller warning
      pv: L4-MSS:BEAMDUMP_CHILLER_WARNING
    moduleErrors:
    - label: PS1225:10
      pv: $(P):PS1225:10:ErrorCode
    - label: PS1225:11
      pv: $(P):PS1225:11:ErrorCode
    - label: IO:15
      pv: $(P):IO:15:ErrorCode
    - label: LDM150A:17
      pv: $(P):LDM150A:17:ErrorCode
    - label: PS5059:22
      pv: $(P):PS5059:22:ErrorCode
    - label: PS5059:23
      pv: $(P):PS5059:23:ErrorCode
    - label: PS5059:24
      pv: $(P):PS5059:24:ErrorCode
    - label: SY3PL50M:32
      pv: $(P):SY3PL50M:32:ErrorCode
    - label: HV40W:40
      pv: $(P):HV40W:40:ErrorCode
    - label: HV40W:42
      pv: $(P):HV40W:42:ErrorCode
    - label: TK6:44
      pv: $(P):TK6:44:ErrorCode
    - label: PHD1K000:48
      pv: $(P):PHD1K000:48:ErrorCode
    - label: SM5-SH:50
      pv: $(P):SM5-SH:50:ErrorCode
    - label: SM5-ATT2:52
      pv: $(P):SM5-ATT2:52:ErrorCode
    chillers:
    - label: PS1225:10
      flow: $(P):PS1225:10:MeasuredFlow
      temp: $(P):PS1225:10:T_Out
      level: $(P):PS1225:10:MeasuredLevel
    - label: PS1225:11
      flow: $(P):PS1225:11:MeasuredFlow
      temp: $(P):PS1225:11:T_Out
      level: $(P):PS1225:11:MeasuredLevel
    flashlamps:
    - label: PS5059:22 Ch1
      pv: $(P):PS5059:22:Ch1_State
    - label: PS5059:23 Ch1
      pv: $(P):PS5059:23:Ch1_State
    - label: PS5059:23 Ch2
      pv: $(P):PS5059:23:Ch2_State
    - label: PS5059:24 Ch1
      pv: $(P):PS5059:24:Ch1_State
    - label: PS5059:24 Ch2
      pv: $(P):PS5059:24:Ch2_State
    delayPresets: [50, 500, 700, 730]
    commands:
      START_LASER: $(P):Start
      STOP_LASER: $(P):Stop
      SET_ATTENUATOR: $(P):SM5-ATT2:52:TargetPosition:W
      FLASHLAMPS_RUN:
        pv: $(P):PS5059:SetAll
        value: RUN
      FLASHLAMPS_STANDBY:
        pv: $(P):PS5059:SetAll
        value: STANDBY
      SET_DELAY: $(P):PS5059:22:Ch1TriggeringDelay:W  # APL uses single channel
    modules:
    - label: PS1225:10
      registers: &chiller_registers
      - {name: ErrorCode, label: Error Code, kind: int}
      - {name: WarningCode, label: Warning Code, kind: int}
      - {name: State, label: State, kind: enum}
      - {name: StandbyMode, label: Standby mode, kind: enum, write: true}
      - {name: T_Out, label: T out, kind: float}
      - {name: T_Tank, label: T tank, kind: float}
      - {name: T_Return, label: T return, kind: float}
      - {name: T_Supply, label: T supply, kind: float}
      - {name: MeasuredFlow, label: Measured flow, kind: float}
      - {name: MeasuredPressure, label: Measured pressure, kind: int}
      - {name: MeasuredLevel, label: Measured level %, kind: int}
      - {name: MeasuredConductivity, label: Measured conductivity, kind: float}
      - {name: OutputTemperature, label: Output temperature, kind: float, write: true}
      - {name: WaterConductivity, label: Water conductivity, kind: float, write: true}
      - {name: HeaterPower, label: Heater power, kind: int, write: true}
      - {name: Beeper, label: Beeper, kind: enum, write: true}
