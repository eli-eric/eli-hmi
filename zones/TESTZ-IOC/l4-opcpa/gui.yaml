# GENERATED by ioc/generate.py --zone TESTZ — DO NOT EDIT.
#
# The `TESTZ` zone with every PV that names a record *field*
# pointed at the base record the local IOC serves instead. A record
# name cannot contain a dot, so this is the only way to run this screen
# against a base-only IOC.
#
#   L4-OPCPA-NL2:PortControl.CNCT  ->  L4-OPCPA-NL2:PortControl:CNCT
#   L4-OPCPA-NL4:PortControl.CNCT  ->  L4-OPCPA-NL4:PortControl:CNCT
#
# Everything else is identical, so what the panel renders here is what it
# renders against `TESTZ` in the hall.
#
# L4 OPCPA — one laser side by side, one `laser-panel` component each.
#
# A laser's PVs share its prefix, so it is said once, as `macros: {P: ...}`, and
# each name is written `$(P):...`. A name without `$(P)` is a full name: the MSS
# PVs live elsewhere and are written out. Two kinds of name never appear here:
# a command PV (CMD_<laser>_<NAME>), which a placeholder in `commands:` falls
# back to, and the ModBox view's registers ($(P):ModBox:<suffix>), which are the
# same on every laser and so belong to the component.
#
# To add a laser: copy a block and change the id and `P`.
# To hide a button: remove its entry from `commands:`.
title: L4 OPCPA
order: 10
description: Operator interface for the L4 OPCPA laser system.
selectable: true
components:
- component: laser-panel
  id: NL2
  macros: {P: L4-OPCPA-NL2}
  pvs:
    connection: $(P):PortControl:CNCT
    fullPower: $(P):FullPower
    shutter: $(P):IO:15:RC1_pin31
    phdMean: $(P):PHD1K000:49:Mean
    regenState: $(P):SY3PL50M:32:State
    regenTemp: $(P):TK6:44:DisplayTemperature
    phd2Mean: $(P):PHD1K000:48:Mean
    attenuator: $(P):SM5-ATT1:51:CurrentPosition
  # The register tree behind this laser's panel, at /l4-opcpa/NL2/registers.
  # A module repeats the same register set on every laser, so the set is an
  # anchor. A module is labelled with its device, and its registers are named
  # $(P):<label>:<name>. A register declaring `nv: true` can be written to the
  # device's non-volatile memory, armed at $(P):UseNVMemory.
  modules:
  - label: PS1225:11
    # `units`, `states` and `range` are simulator scaffolding: they are what
    # the simulator and the local IOC answer a control-field read with. On a
    # real device the record supplies all three (EGU, state strings,
    # DRVL/DRVH), so a real zone writes only name, label, kind, write and nv.
    registers: &chiller_registers
    - {name: T_out, label: Outlet temp, units: °C, range: [20, 26]}
    - {name: MeasuredFlow, label: Flow, units: l/min, range: [11, 16]}
    - {name: SetPoint, label: Setpoint, units: °C, write: true, nv: true, range: [18, 28]}
    - {name: Mode, label: Mode, write: true, kind: enum, states: ["STANDBY", "RUN", "SERVICE"]}
    - {name: PumpSpeed, label: Pump speed, units: rpm, write: true, kind: int, range: [0, 3000], value: 1500}
  - label: PS1225:12
    registers: *chiller_registers
  - label: LDM150A:17
    registers:
      - {name: ErrorCode, label: Error Code, kind: int}
      - {name: Power, label: Power, kind: enum, write: true, nv: true}
      - {name: DiodeCurrentON, label: Diode current ON, kind: enum, write: true}
      - {name: SetCurrent, label: Set Current, kind: float, write: true, nv: true}
      - {name: DisplayCurrent, label: Display Current, kind: float}
      - {name: MeanCurrent, label: Mean Current, kind: float}
      - {name: CurrentSourcePower, label: Current source power, kind: float}
      - {name: VoltageOnLDSource, label: Voltage on LD source, kind: float}
      - {name: PulseWidth, label: Pulse width, kind: int, write: true, nv: true}
      - {name: SyncIn_PulseDelay, label: SyncIn->Pulse delay, kind: int, write: true, nv: true}
      - {name: SynchronizationMode, label: Synchronization mode, kind: enum, write: true, nv: true}
      - {name: RepetitionRateLimit, label: Repetition rate (repetition rate limit), kind: float, write: true, nv: true}
      - {name: FaultSource, label: Fault source, kind: enum}
      - {name: FaultCode, label: Fault code, kind: string}
      - {name: PulseCounter, label: Pulse counter, kind: int, write: true, nv: true}
      - {name: SetCurrentLimit, label: Set current Limit, kind: float, write: true, nv: true}
      - {name: SetLDCurrentSourceVoltage, label: Set LD current source voltage, kind: float, write: true, nv: true}
      - {name: PeakCurrentLimit, label: Peak current limit (hardware), kind: float}
      - {name: CurrentSourcePowerLimit, label: Current source power limit, kind: float, write: true, nv: true}
      - {name: CalibrateSetCurrent, label: Calibrate set current, kind: int, write: true, nv: true}
      - {name: StartPeakCurSamplWin, label: Start peak current sampling window, kind: int, write: true, nv: true}
      - {name: StopPeakCurSamplWin, label: Stop peak current sampling window, kind: int, write: true, nv: true}
      - {name: StartupDelay, label: Startup delay, kind: int, write: true, nv: true}
      - {name: ExternalInterlockOnOff, label: External interlock on/off, kind: enum, write: true, nv: true}
      - {name: CoolingInterlockOnOff, label: Cooling interlock on/off, kind: enum, write: true, nv: true}
      - {name: ExternalInterlockState, label: External interlock state, kind: enum}
      - {name: CoolingInterlockState, label: Cooling interlock state, kind: enum}
      - {name: FeedbackPhotodiodeOutput, label: Feedback photodiode output, kind: int}
      - {name: KeepFeedbackPhotodiodeLevel, label: Keep feedback photodiode level, kind: int, write: true, nv: true}
      - {name: TECPower, label: TEC Power, kind: enum, write: true, nv: true}
      - {name: DisplayTemperature, label: Display temperature, kind: float}
      - {name: SetTemperature, label: Set temperature, kind: float, write: true, nv: true}
      - {name: Stable, label: Stable, kind: enum}
      - {name: SetTemperatureUpperLimit, label: Set temperature upper limit, kind: float, write: true, nv: true}
      - {name: SetTemperatureLowerLimit, label: Set temperature lower limit, kind: float, write: true, nv: true}
      - {name: Kp, label: Kp, kind: float, write: true, nv: true}
      - {name: Ki, label: Ki, kind: float, write: true, nv: true}
      - {name: Kd, label: Kd, kind: float, write: true, nv: true}
      - {name: ManualControl, label: Manual control, kind: enum, write: true}
      - {name: PIDOutput, label: PID output, kind: int, write: true}
      - {name: PIDOutputMax, label: PID output max, kind: int, write: true, nv: true}
      - {name: PIDOutputMin, label: PID output min, kind: int, write: true, nv: true}
      - {name: StabilityWindow, label: Stability window, kind: float, write: true, nv: true}
      - {name: TimeToStayInWindow, label: Time to stay in window to be considered stable, kind: int, write: true, nv: true}
      - {name: MeasuredSensorResistance, label: Measured sensor resistance, kind: float}
      - {name: TECVoltage, label: TEC Voltage, kind: float}
      - {name: TECDriverCurrent, label: TEC Driver Current, kind: float}
      - {name: FirmwareLDM150A, label: Firmware LDM150A, kind: int}
  sequences:
  # The state PV says whether the control system is running this sequence;
  # `command` names the button that starts it, which is what the simulator and
  # the generated IOC hold at 1 while it runs.
  - label: Start Laser
    pv: $(P):SEQ:StartLaser
    command: START_LASER
  - label: Stop Laser
    pv: $(P):SEQ:StopLaser
    command: STOP_LASER
  - label: Set to Alignment Mode
    pv: $(P):SEQ:AlignmentMode
    command: ALIGNMENT_MODE
  - label: Set to System Standby
    pv: $(P):SEQ:SystemStandby
    command: SYSTEM_STANDBY
  - label: Set All Flashlamps to Run
    pv: $(P):SEQ:FlashlampsRun
    command: FLASHLAMPS_RUN
  - label: Set All Flashlamps to Standby
    pv: $(P):SEQ:FlashlampsStandby
    command: FLASHLAMPS_STANDBY
  triggerDelay:
  - $(P):PS5059:22:Ch1TriggeringDelay
  - $(P):PS5059:22:Ch2TriggeringDelay
  mss:
  - label: PSS permission
    pv: L4-PSS:NP2_PERMISSION_TO_OPERATE_CH1
  - label: MSS permission
    pv: L4-MSS:NP2_PERMISSION_TO_OPERATE_CH1
  - label: OPCPA MSS interlock
    pv: L4-MSS:OPA_interlock
  - label: NL2 vacuum good
    pv: L4-VCS-NL2:ReadyToFire
  - label: OPCPA pump tel. vac. good
    pv: L4-VCS-NSOPA_PUMP_TEL:ReadyToFire
  - label: OPCPA seed tel. vac. good
    pv: L4-VCS-NSOPA_SEED_TEL:ReadyToFire
  - label: Beamdump chiller alarm
    pv: L4-MSS:BEAMDUMP_CHILLER_ALARM
  - label: Beamdump chiller warning
    pv: L4-MSS:BEAMDUMP_CHILLER_WARNING
  moduleErrors:
  - label: PS1225:11
    pv: $(P):PS1225:11:ErrorCode
  - label: PS1225:12
    pv: $(P):PS1225:12:ErrorCode
  - label: PS1225:13
    pv: $(P):PS1225:13:ErrorCode
  - label: PS1225:14
    pv: $(P):PS1225:14:ErrorCode
  - label: IO:15
    pv: $(P):IO:15:ErrorCode
  - label: LDM150V5:16
    pv: $(P):LDM150V5:16:ErrorCode
  - label: PS5059:22
    pv: $(P):PS5059:22:ErrorCode
  - label: PS5059:23
    pv: $(P):PS5059:23:ErrorCode
  - label: PS5059:24
    pv: $(P):PS5059:24:ErrorCode
  - label: PS5059:25
    pv: $(P):PS5059:25:ErrorCode
  - label: PS5059:26
    pv: $(P):PS5059:26:ErrorCode
  - label: PS5059:27
    pv: $(P):PS5059:27:ErrorCode
  - label: PS5059:28
    pv: $(P):PS5059:28:ErrorCode
  - label: SY3PL50M:32
    pv: $(P):SY3PL50M:32:ErrorCode
  - label: HV40W:40
    pv: $(P):HV40W:40:ErrorCode
  - label: HV40W:42
    pv: $(P):HV40W:42:ErrorCode
  - label: TK6:44
    pv: $(P):TK6:44:ErrorCode
  - label: PHD1K000:48
    pv: $(P):PHD1K000:48:ErrorCode
  - label: PHD1K000:49
    pv: $(P):PHD1K000:49:ErrorCode
  - label: SM5-SH:50
    pv: $(P):SM5-SH:50:ErrorCode
  - label: SM5-ATT1:51
    pv: $(P):SM5-ATT1:51:ErrorCode
  - label: SM5-ATT2:52
    pv: $(P):SM5-ATT2:52:ErrorCode
  chillers:
  - label: PS1225:11
    flow: $(P):PS1225:11:MeasuredFlow
    temp: $(P):PS1225:11:T_out
    level: $(P):PS1225:11:MeasuredLevel
  - label: PS1225:12
    flow: $(P):PS1225:12:MeasuredFlow
    temp: $(P):PS1225:12:T_out
    level: $(P):PS1225:12:MeasuredLevel
  - label: PS1225:13
    flow: $(P):PS1225:13:MeasuredFlow
    temp: $(P):PS1225:13:T_out
    level: $(P):PS1225:13:MeasuredLevel
  - label: PS1225:14
    flow: $(P):PS1225:14:MeasuredFlow
    temp: $(P):PS1225:14:T_out
    level: $(P):PS1225:14:MeasuredLevel
  flashlamps:
  - label: PS5059:22 Ch1
    pv: $(P):PS5059:22:Ch1_State
  - label: PS5059:22 Ch2
    pv: $(P):PS5059:22:Ch2_State
  - label: PS5059:23 Ch1
    pv: $(P):PS5059:23:Ch1_State
  - label: PS5059:23 Ch2
    pv: $(P):PS5059:23:Ch2_State
  - label: PS5059:24 Ch1
    pv: $(P):PS5059:24:Ch1_State
  - label: PS5059:24 Ch2
    pv: $(P):PS5059:24:Ch2_State
  - label: PS5059:25 Ch1
    pv: $(P):PS5059:25:Ch1_State
  - label: PS5059:25 Ch2
    pv: $(P):PS5059:25:Ch2_State
  - label: PS5059:26 Ch1
    pv: $(P):PS5059:26:Ch1_State
  - label: PS5059:26 Ch2
    pv: $(P):PS5059:26:Ch2_State
  - label: PS5059:27 Ch1
    pv: $(P):PS5059:27:Ch1_State
  - label: PS5059:27 Ch2
    pv: $(P):PS5059:27:Ch2_State
  - label: PS5059:28 Ch1
    pv: $(P):PS5059:28:Ch1_State
  - label: PS5059:28 Ch2
    pv: $(P):PS5059:28:Ch2_State
  # The whole Modbox section, and the ModBox register view, every name
  # $(P):ModBox:<suffix>: every ModBox is the same device (modbox.py).
  modbox: true
  delayPresets:
  - 50
  - 500
  - 700
  - 790
  commands:
    START_LASER: START_LASER
    STOP_LASER: STOP_LASER
    ALIGNMENT_MODE: $(P):SetAlignmentMode
    SYSTEM_STANDBY: SYSTEM_STANDBY
    FLASHLAMPS_RUN: FLASHLAMPS_RUN
    FLASHLAMPS_STANDBY: FLASHLAMPS_STANDBY
    MODBOX_ON: MODBOX_ON
    MODBOX_OFF:
      pv: $(P):ModBox:Awake
      value: Sleep
    # A device reports from one record and is moved by another: these are the
    # write side of the shutter and attenuator rows above.
    OPEN_SHUTTER:
      pv: $(P):SM5-SH:50:SetPosition
      value: 1
    CLOSE_SHUTTER:
      pv: $(P):SM5-SH:50:SetPosition
      value: 0
    SET_ATTENUATOR: $(P):SM5-ATT1:51:SetPosition
    SET_DELAY: $(P):PS5059:22:SetBothChannelsTrigDelay
    # The "50 + Close" chip beside the delay presets: writes 50 to a PV of its
    # own. Leave it out and the presets show as they always did (NL4).
    DELAY_50_CLOSE: DELAY_50_CLOSE
    LOAD_WAVEFORM: LOAD_WAVEFORM
  # Under control, as everything that writes is by default: one tab at a time
  # may use any of NL2's controls, its registers' setpoints included. Any
  # other tab sees who has control and may force it.

# A laser that is not NL2: no Modbox at all, a different set of modules, and
# its own device ids on the rows. Here to be looked at beside NL2 while the
# screen is taken to real lasers — the panel must not assume the reference
# laser's hardware.
- component: laser-panel
  id: NL4
  macros: {P: L4-OPCPA-NL4}
  pvs:
    connection: $(P):PortControl:CNCT
    fullPower: $(P):FullPower
    shutter: $(P):IO:08:RC1_pin31
    # Each row's name sits with the PV it names. Left unset they would print
    # the reference laser's hardware, which looks deliberate and is wrong.
    phdMean:
      pv: $(P):PHD1K000:12:Mean
      label: PHD1K000:12/Mean
    regenState:
      pv: $(P):SY9PL20M:07:State
      label: Regen SY9PL20M:07
    regenTemp:
      pv: $(P):TK3:21:DisplayTemperature
      label: Regen Temp TK3:21
    phd2Mean:
      pv: $(P):PHD1K000:13:Mean
      label: PHD1K000:13/Mean
    attenuator:
      pv: $(P):SM1-ATT3:22:CurrentPosition
      label: Atten. SM1:ATT3:22
  # No `modbox: true`: this laser has no Modbox, so the whole section is absent
  # rather than present and empty.
  sequences:
  - label: Start Laser
    pv: $(P):SEQ:StartLaser
    command: START_LASER
  - label: Stop Laser
    pv: $(P):SEQ:StopLaser
    command: STOP_LASER
  - label: Set All Flashlamps to Run
    pv: $(P):SEQ:FlashlampsRun
    command: FLASHLAMPS_RUN
  - label: Set All Flashlamps to Standby
    pv: $(P):SEQ:FlashlampsStandby
    command: FLASHLAMPS_STANDBY
  triggerDelay:
  - $(P):PS5059:41:Ch1TriggeringDelay
  - $(P):PS5059:41:Ch2TriggeringDelay
  mss:
  - label: PSS permission
    pv: L4-PSS:NP4_PERMISSION_TO_OPERATE_CH1
  - label: MSS permission
    pv: L4-MSS:NP4_PERMISSION_TO_OPERATE_CH1
  - label: NL4 vacuum good
    pv: L4-VCS-NL4:ReadyToFire
  moduleErrors:
  - label: PS1225:31
    pv: $(P):PS1225:31:ErrorCode
  - label: IO:08
    pv: $(P):IO:08:ErrorCode
  - label: SY9PL20M:07
    pv: $(P):SY9PL20M:07:ErrorCode
  - label: PHD1K000:12
    pv: $(P):PHD1K000:12:ErrorCode
  chillers:
  - label: PS1225:31
    flow: $(P):PS1225:31:MeasuredFlow
    temp: $(P):PS1225:31:T_out
    level: $(P):PS1225:31:MeasuredLevel
  - label: PS1225:32
    flow: $(P):PS1225:32:MeasuredFlow
    temp: $(P):PS1225:32:T_out
    level: $(P):PS1225:32:MeasuredLevel
  flashlamps:
  - label: PS5059:41 Ch1
    pv: $(P):PS5059:41:Ch1_State
  - label: PS5059:41 Ch2
    pv: $(P):PS5059:41:Ch2_State
  - label: PS5059:42 Ch1
    pv: $(P):PS5059:42:Ch1_State
  - label: PS5059:42 Ch2
    pv: $(P):PS5059:42:Ch2_State
  delayPresets:
  - 50
  - 500
  - 790
  commands:
    # No MODBOX_ON / MODBOX_OFF / LOAD_WAVEFORM / SEND_YDFA_CURRENT: there is
    # no Modbox to send them to, and a missing key hides the button.
    START_LASER: START_LASER
    STOP_LASER: STOP_LASER
    ALIGNMENT_MODE: $(P):SetAlignmentMode
    SYSTEM_STANDBY: SYSTEM_STANDBY
    FLASHLAMPS_RUN: FLASHLAMPS_RUN
    FLASHLAMPS_STANDBY: FLASHLAMPS_STANDBY
    OPEN_SHUTTER:
      pv: $(P):SM1-SH:08:SetPosition
      value: 1
    CLOSE_SHUTTER:
      pv: $(P):SM1-SH:08:SetPosition
      value: 0
    SET_ATTENUATOR: $(P):SM1-ATT3:22:SetPosition
    SET_DELAY: $(P):PS5059:41:SetBothChannelsTrigDelay
