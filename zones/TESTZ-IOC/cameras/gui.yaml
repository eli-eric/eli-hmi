# GENERATED by ioc/generate.py --zone TESTZ — DO NOT EDIT.
#
# The `TESTZ` zone with every PV that names a record *field*
# pointed at the base record the local IOC serves instead. A record
# name cannot contain a dot, so this is the only way to run this screen
# against a base-only IOC.
#
#   L4-OPCPA-NL2:PortControl.CNCT  ->  L4-OPCPA-NL2:PortControl:CNCT
#   L4-OPCPA-NL4:PortControl.CNCT  ->  L4-OPCPA-NL4:PortControl:CNCT
#
# Everything else is identical, so what the panel renders here is what it
# renders against `TESTZ` in the hall.
#
# Cameras — live images from waveform PVs, through the camera gateway (cameras/).
#
# Every camera here is simulated with `make run`: the simulator draws a laser
# beam with pointing jitter, shot-to-shot energy fluctuation and a sensor's
# noise floor, rather than random static. The PV names are made up (TESTZ-CAM:);
# the hall's camera PVs are not known yet.
#
# One camera per `camera` block. A tile scrolled out of view costs nothing — the
# page only asks the gateway for cameras it is actually showing.
title: Cameras
order: 40
description: Beam cameras, simulated.

components:
  - component: camera
    label: NL1 near field
    pv: TESTZ-CAM:NL1-NF:Image
    width: 1024
    height: 1024
    sim: { profile: flattop, waist: 300 }
  - component: camera
    label: NL1 far field
    pv: TESTZ-CAM:NL1-FF:Image
    width: 1024
    height: 1024
    sim: { waist: 40, pointing: 4 }
  - component: camera
    label: NL2 near field
    pv: TESTZ-CAM:NL2-NF:Image
    width: 1024
    height: 1024
    sim: { profile: flattop, waist: 260 }
  - component: camera
    label: NL2 far field
    pv: TESTZ-CAM:NL2-FF:Image
    width: 1024
    height: 1024
    sim: { waist: 55 }
  - component: camera
    label: Seed
    pv: TESTZ-CAM:SEED:Image
    width: 1024
    height: 1024
    # This IOC is on EPICS base 7: small tiles ask it to drop frames itself.
    filters: true
    sim: { waist: 120, jitter: 0.01 }
  - component: camera
