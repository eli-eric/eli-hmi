services:
  mock-backend:
    build:
      context: ./backend/mockup-websocket-server
      dockerfile: Dockerfile.quickstart
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.quickstart
    depends_on:
      - mock-backend
    environment:
      NEXTAUTH_SECRET: local-dev-secret
      NEXTAUTH_URL: http://localhost:8082/api/auth
      NEXT_PUBLIC_API_URL: localhost:8080
      NEXT_PUBLIC_ZONE_CODE: test
      NODE_ENV: development
    ports:
      - "8082:8082"
