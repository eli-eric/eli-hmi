# default section explanation: You can set global defaults for some keywords. Each default keyword is copied to every job that doesn’t already have it defined. If the job already has a keyword defined, that default is not used.
default:
  # tags not needed in default section because specified at each stage
  #tags:
  #- docker-in-docker  # run on the runner that can do docker-in-docker
  services: # start a container as a service available to the container that runs the pipeline
    # this docker container will run the docker daemon and will be used by the docker cli container
    - name: harbor.eli-beams.eu/dockerhub/docker:27.1.2
      alias: docker # this has to here because in fixes: https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#docker-no-such-host-error
      command: ["--insecure-registry=harbor.eli-beams.eu"] # fixes docker in docker container not trusting self signed cert: https://stackoverflow.com/questions/50133073/gitlab-ci-docker-in-docker-access-to-insecure-registry

variables:
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - test
  - build

# The test suite (`make test`). A runner reaches neither pypi.org nor uv's
# Python downloads, so uv comes from the internal PyPI mirror, packages resolve
# against it, and the interpreter is the image's own — the same arrangement as
# the Dockerfile's build stage. For the same reason the run is not `--locked`:
# the mirror as default index changes the resolution, so uv re-resolves into
# this job's checkout rather than refusing the committed lockfile.
python-hmi-test:
  stage: test
  tags:
    - docker-in-docker
  image: harbor.eli-beams.eu/proxy-dockerhub/python:3.12
  # No docker-in-docker needed; this job just runs pytest.
  services: []
  variables:
    DOCKER_TLS_CERTDIR: ""
    UV_DEFAULT_INDEX: "https://pypi-mirror.eli-beams.eu/root/pypi/+simple/"
    UV_INSECURE_HOST: "pypi-mirror.eli-beams.eu"
    UV_PYTHON_DOWNLOADS: "never"
    UV_LINK_MODE: "copy"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    - pip install --no-cache-dir --index-url https://pypi-mirror.eli-beams.eu/root/pypi/+simple/ --trusted-host pypi-mirror.eli-beams.eu uv
  script:
    - make test

# The HMI image: one image that is both the operator interface and the EPICS
# gateway. Built from the repository root, whose Dockerfile builds in two
# stages: a runner can reach neither the Debian repositories nor pypi.org, so
# the toolchain comes from the full python image and the packages from the
# internal PyPI mirror.
#
# Branch model: `main` is production, `dev` is integration, everything else is
# work in progress. Every branch pushes `:<branch-slug>` (its newest build) and
# `:<branch-slug>-<short-sha>` (that exact build, never overwritten). Only
# `main` moves `:latest`, so `latest` is always the production image. The
# branch is named literally: the repository's default branch is `dev`, so
# $CI_DEFAULT_BRANCH would make `dev` production. A tag pipeline has no
# $CI_COMMIT_BRANCH, so a git tag never moves `latest` either.
docker-build-job-python-hmi:
  stage: build
  image: harbor.eli-beams.eu/proxy-dockerhub/docker:27.1.2
  tags:
    - docker-in-docker
  variables:
    IMAGE: ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-ssr
  script:
    - docker info
    # Both stages: the full image compiles the dependencies, the slim one runs
    # them. Pulled here so the build does not depend on a cold fetch.
    - docker pull harbor.eli-beams.eu/proxy-dockerhub/python:3.12
    - docker pull harbor.eli-beams.eu/proxy-dockerhub/python:3.12-slim
    - docker build -t "$IMAGE:$CI_COMMIT_REF_SLUG" -t "$IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA" .
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_URL"
    - docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
    - docker push "$IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$IMAGE:$CI_COMMIT_REF_SLUG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
