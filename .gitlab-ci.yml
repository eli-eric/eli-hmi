# default section explanation: You can set global defaults for some keywords. Each default keyword is copied to every job that doesn’t already have it defined. If the job already has a keyword defined, that default is not used.
default:
  # tags not needed in default section because specified at each stage
  #tags:
  #- docker-in-docker  # run on the runner that can do docker-in-docker
  services: # start a container as a service available to the container that runs the pipeline
    # this docker container will run the docker daemon and will be used by the docker cli container
    - name: harbor.eli-beams.eu/dockerhub/docker:27.1.2
      alias: docker # this has to here because in fixes: https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#docker-no-such-host-error
      command: ["--insecure-registry=harbor.eli-beams.eu"] # fixes docker in docker container not trusting self signed cert: https://stackoverflow.com/questions/50133073/gitlab-ci-docker-in-docker-access-to-insecure-registry

variables:
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - test
  - build
  - deploy

docs-validate:
  stage: test
  image: harbor.eli-beams.eu/proxy-dockerhub/node:20.18-alpine
  tags:
    - docker-in-docker
  services: []
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - node scripts/docs/check-index.js
    - node scripts/docs/check-links.js
  rules:
    - changes:
        - docs/**/*
        - scripts/docs/**/*

frontend-test:
  stage: test
  tags:
    - docker-in-docker # run on the runner that can do docker-in-docker
  # Pin to a major.minor tag so unreviewed minor bumps don't change build
  # behaviour. Pin to a digest as well if reproducibility ever bites.
  image: harbor.eli-beams.eu/eli_images/eli-node:22-alpine
  # No docker-in-docker needed; this job just runs `npm test`.
  services: []
  variables:
    DOCKER_TLS_CERTDIR: ""
    NPM_CONFIG_REGISTRY: "https://npm-mirror1.eli-beams.eu/"
    NPM_CONFIG_STRICT_SSL: "false"
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - rm -rf node_modules
    - npm ci --prefer-offline --no-audit --loglevel=verbose --fetch-retries=3 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=20000
    - test -x node_modules/.bin/vitest
  script:
    - npm run validate:config -- --dir ../eli-hmi-config --all
    - npm test -- --run --coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage/lcov-report/
      - frontend/coverage/lcov.info
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    expire_in: 1 week
  coverage: '/Lines\s+:\s+([\d.]+)%/'

docker-build-job-demo:
  stage: build
  # all commands in this stage will run in this docker container that will provide the docker cli
  image: harbor.eli-beams.eu/proxy-dockerhub/docker:27.1.2
  tags:
    - docker-in-docker # run on the runner that can do docker-in-docker
  script:
    - docker info
    - docker pull harbor.eli-beams.eu/eli_images/eli-node:22-alpine # this fixes a SSL verify error when running docker build
    - docker build -t ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend-demo:${CI_COMMIT_REF_SLUG} --file=frontend/Dockerfile.demo .
    - docker login -u ${HARBOR_USERNAME} -p ${HARBOR_PASSWORD} ${HARBOR_URL}
    - docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend-demo:${CI_COMMIT_REF_SLUG}
    - docker tag ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend-demo:${CI_COMMIT_REF_SLUG} ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend-demo:latest
    - docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend-demo:latest

docker-build-job-frontend:
  stage: build
  image: harbor.eli-beams.eu/proxy-dockerhub/docker:27.1.2
  tags:
    - docker-in-docker
  script:
    - docker info
    - docker pull harbor.eli-beams.eu/eli_images/eli-node:22-alpine
    - docker build -t ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend:${CI_COMMIT_REF_SLUG} --file=frontend/Dockerfile frontend
    - docker login -u ${HARBOR_USERNAME} -p ${HARBOR_PASSWORD} ${HARBOR_URL}
    - docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend:${CI_COMMIT_REF_SLUG}
    - docker tag ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend:${CI_COMMIT_REF_SLUG} ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend:latest
    - docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-frontend:latest

# Packages `npm run validate:config` as a standalone CLI image so the controls
# team's config repo can validate without Node or an app checkout. The config
# repo must pin an explicit tag — see eli-hmi-config/ci-example.yml.
docker-build-job-config-validator:
  stage: build
  image: harbor.eli-beams.eu/proxy-dockerhub/docker:27.1.2
  tags:
    - docker-in-docker
  script:
    - docker info
    - docker pull harbor.eli-beams.eu/eli_images/eli-node:22-alpine
    - docker build --target validator -t ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_REF_SLUG} --file=frontend/Dockerfile frontend
    - docker login -u ${HARBOR_USERNAME} -p ${HARBOR_PASSWORD} ${HARBOR_URL}
    - docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_REF_SLUG}
    - docker tag ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_REF_SLUG} ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_SHA}
    - docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_SHA}
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        docker tag ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_REF_SLUG} ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_TAG}
        docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_TAG}
      fi
    - docker tag ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:${CI_COMMIT_REF_SLUG} ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:latest
    - docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/eli-hmi-config-validator:latest

