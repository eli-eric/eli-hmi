services:
  mock-backend:
    image: lcs-harbor.lcs.local/lcs/eli-hmi-backend-mockup-demo:latest
    container_name: lcs-deploy-testz-hmi-mock-backend
    network_mode: host
    restart: unless-stopped

  python-backend:
    image: lcs-harbor.lcs.local/lcs/eli-hmi-backend-python:latest
    container_name: lcs-deploy-testz-hmi-python-backend
    network_mode: host
    restart: unless-stopped
    # Override image entrypoint to run on 8081 (host networking + avoid 8080 collision).
    entrypoint:
      ["fastapi", "run", "server.py", "--host", "0.0.0.0", "--port", "8081"]

  frontend:
    image: lcs-harbor.lcs.local/lcs/eli-hmi-frontend:latest
    container_name: lcs-deploy-testz-hmi-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mock-backend
      - python-backend
    environment:
      NEXTAUTH_SECRET: change-me-in-production
      NEXTAUTH_URL: http://testz-deploy20:8082/api/auth
      # NOTE: NEXT_PUBLIC_* values are baked into the frontend at image build time.
      # Runtime docker-compose env does not rewrite already-built client bundles.
      # The app includes a runtime fallback that replaces baked localhost with
      # the browser host so this deployment still targets testz-deploy20.
      NEXT_PUBLIC_API_URL: testz-deploy20:8080
      NEXT_PUBLIC_WEBSOCKET_URL: ws://testz-deploy20:8080/ws/pvs
      NEXT_PUBLIC_ZONE_CODE: test
