services:
  mock-backend:
    image: lcs-harbor.lcs.local/lcs/eli-hmi-backend-mockup-demo:latest
    container_name: lcs-deploy-testz-hmi-mock-backend
    network_mode: host
    restart: unless-stopped

  python-backend:
    image: lcs-harbor.lcs.local/lcs/eli-hmi-backend-python:latest
    container_name: lcs-deploy-testz-hmi-python-backend
    network_mode: host
    restart: unless-stopped
    # Override image entrypoint to run on 8081 (host networking + avoid 8080 collision).
    entrypoint:
      ["fastapi", "run", "server.py", "--host", "0.0.0.0", "--port", "8081"]

  frontend:
    image: lcs-harbor.lcs.local/lcs/eli-hmi-frontend:latest
    container_name: lcs-deploy-testz-hmi-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mock-backend
      - python-backend
    environment:
      NEXTAUTH_SECRET: change-me-in-production
      NEXTAUTH_URL: http://testz-deploy20:8082/api/auth
      # API_URL/ZONE_CODE are read live at container start (via
      # /api/runtime-config for the client, process.env directly for
      # middleware) — the image is the same global build for every zone.
      API_URL: testz-deploy20:8080
      ZONE_CODE: test
      # Zone + module config (CSI-861) is read at runtime from this mounted
      # directory — a clone of the controls-team config repo (layout: the
      # in-repo eli-hmi-config/ template). Config change = edit/pull the clone
      # + restart this container; no image rebuild. A broken/missing config
      # stops the container at startup (see frontend instrumentation.ts).
      CONFIG_DIR: /app/zone-config
    volumes:
      # Path to the config repo clone on the deploy host; must be readable by
      # uid 1001 (the image's `nextjs` user).
      - /opt/eli-hmi-config:/app/zone-config:ro
